# Site de STAGING de la migración Astro (base directory: astro-site)
# El site de producción actual (SPA) usa el netlify.toml de la raíz del repo — no se toca.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Alias de idioma: en la SPA /es/formacion-presencial renderiza la MISMA página que
# /formacion-presencial (ruta ES canónica sin prefijo). En Astro NO se duplica la página:
# se redirige 301 al canónico. Sin `force` → solo aplica si no existe fichero /es/formacion-presencial
# (no existe), por lo que no ensombrece nada del build.
[[redirects]]
  from = "/es/formacion-presencial"
  to = "/formacion-presencial"
  status = 301

# Fase 5 (STAGING ONLY): este site (base=astro-site) NO despliega las netlify
# functions — viven en la raíz del repo y las sirve el site de producción.
# Proxy 200 para que los islands de la zona app (verify-purchase,
# get-download-urls, resend-access, admin-generate-access) funcionen en
# staging contra el backend real (mismo origen para el navegador → sin CORS).
# ⚠️ QUITAR en el cutover (Fase 7): si este toml pasara a ser el de producción,
# la regla se proxyaría a sí misma en bucle.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "https://aichef.pro/.netlify/functions/:splat"
  status = 200
  force = true

# D7 del PLAN MAESTRO: el staging NO se indexa hasta el cutover (Fase 7).
# ⚠️ QUITAR este bloque en el cutover — y solo entonces.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
